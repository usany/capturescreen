<!doctype html>
<!--
  public/index.html
  Author: client-side-writer
  Created: 2026-07-26

  The only page. Static markup with Tailwind classes and no inline script — all
  behaviour is bundled into /js/app.js from src/client/main.ts.

  Every `data-testid` here is a contract with tests/helpers/constants.ts
  (TESTIDS) and planner 4.2. Restyle freely; do not rename a testid.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Screenshot</title>
    <link rel="stylesheet" href="/styles/tailwind.css" />
    <link rel="icon" href="data:," />
  </head>

  <body
    class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
  >
    <div
      data-testid="app-shell"
      class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8 sm:px-6"
    >
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">URL Screenshot</h1>
          <p
            class="mt-1 text-sm text-slate-500 dark:text-slate-400"
            data-i18n="app.tagline"
          >
            Capture any page at any viewport size, then download it as PNG or
            JPEG.
          </p>
        </div>

        <div class="flex items-center gap-3">
          <!-- Light/dark toggle: icon + label show what a click will switch TO
               (cf. src/client/components/themeToggle.ts). Sun = switch to light,
               moon = switch to dark. -->
          <button
            data-testid="theme-toggle"
            type="button"
            role="switch"
            aria-pressed="false"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
            class="inline-flex shrink-0 items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800 dark:focus:ring-slate-600"
          >
            <svg
              data-testid="theme-icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-4 w-4"
              aria-hidden="true"
              hidden
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              ></path>
            </svg>
            <svg
              data-testid="theme-icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-4 w-4"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
            </svg>
            <span data-testid="theme-label">Dark mode</span>
          </button>

          <!-- Language toggle: shows the TARGET language code (cf.
               src/client/components/langToggle.ts). Mirrors the server's
               /en and /ko routes by writing the same `lang` cookie. -->
          <button
            data-testid="lang-toggle"
            type="button"
            aria-label="Switch to Korean"
            title="Switch to Korean"
            class="inline-flex shrink-0 items-center rounded-full border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800 dark:focus:ring-slate-600"
          >
            <span data-testid="lang-label">KO</span>
          </button>
        </div>
      </header>



      <!-- ── Controls ────────────────────────────────────────────────────── -->
      <section
        data-testid="control-panel"
        aria-label="Capture settings"
        class="flex flex-col gap-5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none"
      >
        <!-- URL -->
        <div class="flex flex-col gap-2">
          <label
            for="url-input"
            class="text-sm font-medium text-slate-700 dark:text-slate-300"
            >Page URL</label
          >
          <div class="flex flex-col gap-2 sm:flex-row">
            <input
              id="url-input"
              data-testid="url-input"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://example.com"
              aria-describedby="url-error"
              class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:ring-blue-900/60"
            />
            <button
              data-testid="capture-btn"
              type="button"
              data-state="idle"
              class="shrink-0 rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 dark:hover:bg-blue-500 dark:focus:ring-blue-800 dark:disabled:bg-slate-700 dark:disabled:text-slate-400"
            >
              Capture
            </button>
          </div>

          <p
            id="url-error"
            data-testid="url-error"
            role="alert"
            hidden
            class="text-sm font-medium text-red-600 dark:text-red-400"
          >
            Enter a valid http(s) URL
          </p>

          <label
            class="mt-1 inline-flex w-fit items-center gap-2 text-sm text-slate-600 dark:text-slate-400"
          >
            <input
              data-testid="auto-capture-toggle"
              type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-300 dark:border-slate-600 dark:bg-slate-800 dark:text-blue-500 dark:focus:ring-blue-900"
            />
            <span id="auto-capture-label" data-i18n="autoCapture"
              >Auto-capture when I stop typing</span
            >
          </label>
        </div>

        <hr class="border-slate-100 dark:border-slate-800" />

        <!-- Size -->
        <div class="flex flex-col gap-2">
          <div class="flex flex-wrap items-end gap-4">
            <div class="flex flex-col gap-1">
              <label
                for="width-input"
                class="text-sm font-medium text-slate-700 dark:text-slate-300"
                ><span data-i18n="size.width">Width</span></label
              >
              <input
                id="width-input"
                data-testid="width-input"
                type="number"
                min="200"
                max="5000"
                step="1"
                aria-describedby="dimension-error"
                class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800/60 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-900/60"
              />
            </div>

            <span
              class="pb-2.5 text-slate-400 dark:text-slate-500"
              aria-hidden="true"
              >×</span
            >

            <div class="flex flex-col gap-1">
              <label
                for="height-input"
                class="text-sm font-medium text-slate-700 dark:text-slate-300"
                ><span data-i18n="size.height">Height</span></label
              >
              <input
                id="height-input"
                data-testid="height-input"
                type="number"
                min="200"
                max="20000"
                step="1"
                aria-describedby="dimension-error"
                class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800/60 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-900/60"
              />
            </div>

            <button
              data-testid="reset-size-btn"
              type="button"
              title="Reset to this screen's size"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus:ring-slate-600"
            >
              Reset to screen size
            </button>
          </div>

          <p
            id="dimension-error"
            data-testid="dimension-error"
            role="alert"
            hidden
            class="text-sm font-medium text-red-600 dark:text-red-400"
          ></p>
        </div>

        <hr class="border-slate-100 dark:border-slate-800" />

        <!-- Output -->
        <div class="flex flex-wrap items-center gap-6">
          <div class="flex flex-col gap-1">
            <label
              for="format-select"
              class="text-sm font-medium text-slate-700 dark:text-slate-300"
              ><span data-i18n="format.label">Format</span></label
            >
            <select
              id="format-select"
              data-testid="format-select"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-900/60"
            >
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>

          <!-- Hidden for PNG: quality is a JPEG-only setting. -->
          <div data-testid="quality-row" hidden class="flex flex-col gap-1">
            <label
              for="quality-slider"
              class="text-sm font-medium text-slate-700 dark:text-slate-300"
            >
              <span data-i18n="quality.label">Quality</span>
              <span
                data-testid="quality-value"
                class="tabular-nums text-slate-500 dark:text-slate-400"
                >90</span
              >
            </label>
            <input
              id="quality-slider"
              data-testid="quality-slider"
              type="range"
              min="1"
              max="100"
              step="1"
              value="90"
              class="w-48 accent-blue-600"
            />
          </div>

          <label
            class="inline-flex items-center gap-2 self-end pb-2 text-sm text-slate-600 dark:text-slate-400"
          >
            <input
              data-testid="fullpage-toggle"
              type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-300 dark:border-slate-600 dark:bg-slate-800 dark:text-blue-500 dark:focus:ring-blue-900"
            />
            <span data-i18n="fullpage">Full page</span>
          </label>
        </div>
      </section>

      <!-- ── Preview ─────────────────────────────────────────────────────── -->
      <section
        data-testid="preview-pane"
        aria-label="Screenshot preview"
        class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none"
      >
        <div
          class="preview-checkerboard flex min-h-64 items-center justify-center overflow-auto rounded-lg border border-dashed border-slate-200 p-3 dark:border-slate-700"
        >
          <div
            data-testid="preview-empty"
            class="text-center text-sm text-slate-400 dark:text-slate-500"
            data-i18n="preview.empty"
          >
            Preview will appear here
          </div>

          <div
            data-testid="loading-spinner"
            role="status"
            hidden
            class="flex flex-col items-center gap-3 text-sm text-slate-500 dark:text-slate-400"
          >
            <span class="spinner-ring block h-9 w-9" aria-hidden="true"></span>
            <span data-i18n="capture.busy">Capturing…</span>
          </div>

          <!-- max-w-full h-auto: a 1980-wide capture scales down to fit while
               naturalWidth stays the true captured size for assertions. -->
          <img
            data-testid="preview-image"
            hidden
            alt=""
            class="h-auto max-w-full rounded shadow-sm"
          />

          <div
            data-testid="preview-error"
            role="alert"
            hidden
            class="max-w-lg rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-center text-sm font-medium text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300"
          ></div>
        </div>

        <p
          data-testid="preview-meta"
          hidden
          class="text-sm tabular-nums text-slate-500 dark:text-slate-400"
        ></p>
      </section>

      <!-- ── Download ────────────────────────────────────────────────────── -->
      <!-- Hidden until a capture succeeds. download-btn is a native <a download>
           so the browser fires a real download event (planner A3). -->
      <div
        data-testid="download-bar"
        hidden
        class="flex flex-wrap items-center gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none"
      >
        <a
          data-testid="download-btn"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-300 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white dark:focus:ring-slate-500"
          data-i18n="download"
        >
          Download
        </a>
        <button
          data-testid="download-png-btn"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus:ring-slate-600"
          data-i18n="download.png"
        >
          Download as PNG
        </button>
        <button
          data-testid="download-jpeg-btn"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus:ring-slate-600"
          data-i18n="download.jpeg"
        >
          Download as JPEG
        </button>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
