<!DOCTYPE html>
<!--
  public/index.html
  Author: client-side-writer
  Created: 2026-07-26

  The only page. Static markup with Tailwind classes and no inline script — all
  behaviour is bundled into /js/app.js from src/client/main.ts.

  Every `data-testid` here is a contract with tests/helpers/constants.ts
  (TESTIDS) and planner 4.2. Restyle freely; do not rename a testid.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Screenshot</title>
    <link rel="stylesheet" href="/styles/tailwind.css" />
    <link rel="icon" href="data:," />
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <div data-testid="app-shell" class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8 sm:px-6">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">URL Screenshot</h1>
          <p class="mt-1 text-sm text-slate-500">
            Capture any page at any viewport size, then download it as PNG or JPEG.
          </p>
        </div>

        <div
          data-testid="status-banner"
          role="status"
          aria-live="polite"
          class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-sm font-medium"
        >
          <span class="status-dot" aria-hidden="true"></span>
          <span data-testid="status-text">Checking…</span>
        </div>
      </header>

      <!-- ── Controls ────────────────────────────────────────────────────── -->
      <section
        data-testid="control-panel"
        aria-label="Capture settings"
        class="flex flex-col gap-5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm"
      >
        <!-- URL -->
        <div class="flex flex-col gap-2">
          <label for="url-input" class="text-sm font-medium text-slate-700">Page URL</label>
          <div class="flex flex-col gap-2 sm:flex-row">
            <input
              id="url-input"
              data-testid="url-input"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://example.com"
              aria-describedby="url-error"
              class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
            <button
              data-testid="capture-btn"
              type="button"
              data-state="idle"
              class="shrink-0 rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500"
            >
              Capture
            </button>
          </div>

          <p
            id="url-error"
            data-testid="url-error"
            role="alert"
            hidden
            class="text-sm font-medium text-red-600"
          >
            Enter a valid http(s) URL
          </p>

          <label class="mt-1 inline-flex w-fit items-center gap-2 text-sm text-slate-600">
            <input
              data-testid="auto-capture-toggle"
              type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-300"
            />
            <span>Auto-capture when I stop typing</span>
          </label>
        </div>

        <hr class="border-slate-100" />

        <!-- Size -->
        <div class="flex flex-col gap-2">
          <div class="flex flex-wrap items-end gap-4">
            <div class="flex flex-col gap-1">
              <label for="width-input" class="text-sm font-medium text-slate-700">Width</label>
              <input
                id="width-input"
                data-testid="width-input"
                type="number"
                min="200"
                max="5000"
                step="1"
                aria-describedby="dimension-error"
                class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
              />
            </div>

            <span class="pb-2.5 text-slate-400" aria-hidden="true">×</span>

            <div class="flex flex-col gap-1">
              <label for="height-input" class="text-sm font-medium text-slate-700">Height</label>
              <input
                id="height-input"
                data-testid="height-input"
                type="number"
                min="200"
                max="20000"
                step="1"
                aria-describedby="dimension-error"
                class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
              />
            </div>

            <button
              data-testid="reset-size-btn"
              type="button"
              title="Reset to this screen's size"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200"
            >
              Reset to screen size
            </button>
          </div>

          <p
            id="dimension-error"
            data-testid="dimension-error"
            role="alert"
            hidden
            class="text-sm font-medium text-red-600"
          ></p>
        </div>

        <hr class="border-slate-100" />

        <!-- Output -->
        <div class="flex flex-wrap items-center gap-6">
          <div class="flex flex-col gap-1">
            <label for="format-select" class="text-sm font-medium text-slate-700">Format</label>
            <select
              id="format-select"
              data-testid="format-select"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>

          <!-- Hidden for PNG: quality is a JPEG-only setting. -->
          <div data-testid="quality-row" hidden class="flex flex-col gap-1">
            <label for="quality-slider" class="text-sm font-medium text-slate-700">
              Quality <span data-testid="quality-value" class="tabular-nums text-slate-500">90</span>
            </label>
            <input
              id="quality-slider"
              data-testid="quality-slider"
              type="range"
              min="1"
              max="100"
              step="1"
              value="90"
              class="w-48 accent-blue-600"
            />
          </div>

          <label class="inline-flex items-center gap-2 self-end pb-2 text-sm text-slate-600">
            <input
              data-testid="fullpage-toggle"
              type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-300"
            />
            <span>Full page</span>
          </label>
        </div>
      </section>

      <!-- ── Preview ─────────────────────────────────────────────────────── -->
      <section
        data-testid="preview-pane"
        aria-label="Screenshot preview"
        class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm"
      >
        <div
          class="preview-checkerboard flex min-h-64 items-center justify-center overflow-auto rounded-lg border border-dashed border-slate-200 p-3"
        >
          <div data-testid="preview-empty" class="text-center text-sm text-slate-400">
            Preview will appear here
          </div>

          <div
            data-testid="loading-spinner"
            role="status"
            hidden
            class="flex flex-col items-center gap-3 text-sm text-slate-500"
          >
            <span class="spinner-ring block h-9 w-9" aria-hidden="true"></span>
            <span>Capturing…</span>
          </div>

          <!-- max-w-full h-auto: a 1980-wide capture scales down to fit while
               naturalWidth stays the true captured size for assertions. -->
          <img
            data-testid="preview-image"
            hidden
            alt=""
            class="h-auto max-w-full rounded shadow-sm"
          />

          <div
            data-testid="preview-error"
            role="alert"
            hidden
            class="max-w-lg rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-center text-sm font-medium text-red-700"
          ></div>
        </div>

        <p data-testid="preview-meta" hidden class="text-sm tabular-nums text-slate-500"></p>
      </section>

      <!-- ── Download ────────────────────────────────────────────────────── -->
      <!-- Hidden until a capture succeeds. download-btn is a native <a download>
           so the browser fires a real download event (planner A3). -->
      <div
        data-testid="download-bar"
        hidden
        class="flex flex-wrap items-center gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
      >
        <a
          data-testid="download-btn"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-300"
        >
          Download
        </a>
        <button
          data-testid="download-png-btn"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200"
        >
          Download as PNG
        </button>
        <button
          data-testid="download-jpeg-btn"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200"
        >
          Download as JPEG
        </button>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
